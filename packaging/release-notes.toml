# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.2.4"

[locales."en-us"]
whats-new = """
The eight named parts of the day (Afterrise to Forerise) are now called eighths everywhere, matching the Bogenzeit standard: the Quarter widget and complication are now Eighth. If you had placed one, add the Eighth widget again.
"""
