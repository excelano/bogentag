# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.3"

[locales."en-us"]
whats-new = """
Settings now chooses the dial and the precision from menus, so Kiloseconds is no longer cut off on Apple Watch, and precision reads Low, Medium or High.
"""
