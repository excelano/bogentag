# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.7"

[locales."en-us"]
whats-new = """
A running span timer now shows on the Lock Screen and in the Dynamic Island, with where it ends and a bar that fills as it runs, so you can follow it without opening the app. The Dial widget comes in a large size on the Home Screen with the full dial, ring and readout, and on the Lock Screen the rectangular Dial sets the reading and the eighth beside the sky.
"""
