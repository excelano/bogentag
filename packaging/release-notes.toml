# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.1"

[locales."en-us"]
whats-new = """
The timer starts from shorter presets, 1, 2, 5 and 10 spans or 0.2 to 2 kiloseconds, and on iPhone a tap on the amount lets you type one in. The timer and stopwatch now count in the dial's unit, spans or kiloseconds, one at a time, and always show it at high precision.
"""
