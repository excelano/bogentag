# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.5"

[locales."en-us"]
whats-new = """
The reading on the watch face is much easier to see. In a round slot, the Reading and Gauge complications draw it as large as the slot allows. In a corner, Gauge shows it in large type curved along the edge of the screen above the Sun's progress, like the battery, and Eighth and Next curve it above the eighth or the event they name. Gauge replaces the Corner complication, and the watch no longer offers the Dial complication, which was too small to read; the Dial widget stays on iPhone.
"""
