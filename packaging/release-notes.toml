# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.0"

[locales."en-us"]
whats-new = """
A timer and a stopwatch that count in spans as well as kiloseconds. A span timer ends when the Sun has moved that many spans along its arc, so the same timer lasts longer across sunset; an arc on the dial shows where it ends, and a notification says when. On iPhone, the dial and precision choices and About Bogenzeit have moved into Settings, behind the gear at the top right.
"""
