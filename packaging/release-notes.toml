# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.6"

[locales."en-us"]
whats-new = """
Ask Siri what any time today is in Bogenzeit. Say "Convert a time with Bogentag", answer with a time such as 3 pm or fifteen hundred, and Siri reads it back for where you are, as in 54.1 Foreset, in the dial and precision you have chosen. The same action is in the Shortcuts app, where it hands the reading on to the next step.
"""
