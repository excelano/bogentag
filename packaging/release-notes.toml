# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.3.5"

[locales."en-us"]
whats-new = """
The reading on the watch face is much easier to see. In a round slot, the Reading and Gauge complications draw it as large as the slot allows, and in a corner, every complication shows it in large type curved along the edge of the screen, like the battery.
"""
