# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.1.1"

[locales."en-us"]
whats-new = """
The solar calculations and the drawn symbols now come from a shared Bogenzeit engine. Every reading, dial, complication and widget should look and read as before; please report anything that differs.
