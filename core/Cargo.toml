[package]
name = "bogenzeit"
description = "Bogenzeit: time as position on the Sun's arc. The engine and the bz command"
version = "0.1.0"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
publish = false

# The code imports `bz`, the spec's package prefix (Bogenzeit spec §8); the
# package name is a coordinate and nothing imports it.
[lib]
name = "bz"
path = "src/lib.rs"

[[bin]]
name = "bz"
path = "src/main.rs"

[dependencies]

[dev-dependencies]
# Reads vectors/bz_vectors.json in the tests; the engine itself depends on nothing.
serde_json = "1"
